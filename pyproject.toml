[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lola-2016-toolkit"
version = "0.2.0"
description = "Curation, validation, export, and benchmark tools for LoLA-2016"
requires-python = ">=3.10,<3.14"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=14,<22",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["lola_dataset*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
